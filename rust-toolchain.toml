# Rust 1.99 is the project compiler/tooling baseline.
#
# Formatting is the one explicit exception: rustfmt.toml uses unstable rustfmt
# options, so formatting must be invoked as `cargo +nightly fmt`. The justfile
# and CI do that explicitly; nightly is not used to compile, lint, or test the
# project. Keeping rustfmt out of the default toolchain also makes an accidental
# plain `cargo fmt` fail instead of silently ignoring the unstable options.
[toolchain]
channel = "1.99.0"
components = ["clippy"]
targets = ["wasm32-unknown-unknown"]
