name: Duplicate-code regression

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@2a1b1b963b9df30329c02a82de5687d5fefe4ed5 # main
  merge-gate:
    name: Duplicate-code merge gate
    if: ${{ always() }}
    needs: [duplicates]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@2a1b1b963b9df30329c02a82de5687d5fefe4ed5 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["duplicates","success"]]'
