name: Duplicate-code regression

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
  merge-gate:
    name: Duplicate-code merge gate
    if: ${{ always() }}
    needs: [duplicates]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["duplicates","success"]]'
