name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@bbf10fc888e22a266c3df73c16cceb4b6624895f # main
    with:
      cargo-args: "--workspace --all-targets"
      checkout-submodules: "true"
