name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@004d3f55d72c127169b59add6f74638fd5560403 # main
    with:
      cargo-args: "--workspace --all-targets"
      checkout-submodules: "true"
