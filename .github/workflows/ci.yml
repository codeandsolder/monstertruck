name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      wasm_only:
        description: "Run only the wasm32 build (for dependency compatibility checks)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    if: ${{ !inputs.wasm_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      # Use the exact pinned nightly so unstable rustfmt options are enforced.
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly-2026-11-19
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly-2026-11-19
          components: clippy
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main
        with:
          rust-toolchain: "nightly-2026-11-19"
          rustflags: "-D warnings"
      - run: cargo clippy --all-targets -- -D warnings
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main


  test:
    name: cargo test (cpu)
    if: ${{ !inputs.wasm_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly-2026-11-19
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main
        with:
          rust-toolchain: "nightly-2026-11-19"
          rustflags: "-D warnings"
      - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
      # Pinned: cargo-rdme's output is not stable across major versions, so an
      # unpinned `@latest` would fail `readme-check` the day it majors.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-rdme@2.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just readme-check
      - run: just test-cpu
      - name: Constructive STEP recovery library (current Linux Rust)
        run: cargo test -p step-redox --lib --bin step-validate-semantics --features cad-kernel-monstertruck
      - run: just test-doc
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main


  shared-sccache:
    name: workspace lib tests (shared sccache)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      id-token: write
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main
    with:
      command: |
        git submodule update --init resources
        cargo test --workspace --lib
      rust-toolchain: "nightly-2026-11-19"
      rustflags: "-D warnings -C target-cpu=x86-64-v2"

  meshing-features:
    name: monstertruck-meshing feature subsets
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly-2026-11-19
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main
        with:
          rust-toolchain: "nightly-2026-11-19"
          rustflags: "-D warnings"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just meshing-features
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main


  wasm-build:
    name: cargo build (wasm32)
    # Keep ordinary PR CI lean. Allow an explicit wasm-only dispatch to test
    # dependency upgrades before merging instead of discovering failures on tags.
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.wasm_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly-2026-11-19
          targets: wasm32-unknown-unknown
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main
        with:
          rust-toolchain: "nightly-2026-11-19"
          rustflags: "-D warnings"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just wasm-build
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@a5eb5179a21839ed047f10897a01ce3c7ec178b4 # main
