name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      checkout-submodules: "true"
      rustflags: "-D warnings"
      timeout-minutes: 90
      command: |
        cargo fmt --all -- --check
        cargo check --locked --manifest-path step-redox/fuzz/Cargo.toml --bins
        cargo test --locked -p step-redox --lib --bin step-validate-semantics --features cad-kernel-monstertruck
        cargo check --locked -p monstertruck-meshing --no-default-features --features analyzers
        cargo check --locked -p monstertruck-meshing --no-default-features --features filters
        cargo check --locked -p monstertruck-meshing --no-default-features --features tessellation
      strict-suites: |
        [{"name":"native","cargo":["--locked","--workspace","--all-targets"],"allow-test-panics":true}]
      test-suites: |
        [{"name":"cpu","cargo":["--locked","-p","monstertruck-core","-p","monstertruck-traits","-p","monstertruck-geometry","-p","monstertruck-topology","-p","monstertruck-mesh","-p","monstertruck-meshing","-p","monstertruck-modeling","-p","monstertruck-solid","-p","monstertruck-healing","-p","monstertruck-fillet","-p","monstertruck-io","--features","derive","--features","polynomial"],"doctests":["--locked","-p","monstertruck-core","-p","monstertruck-traits","-p","monstertruck-geometry","-p","monstertruck-topology","-p","monstertruck-mesh","-p","monstertruck-meshing","-p","monstertruck-modeling","-p","monstertruck-solid","-p","monstertruck-healing","-p","monstertruck-fillet","-p","monstertruck-io","--features","derive","--features","polynomial"]}]
  wasm:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      checkout-submodules: "true"
      rust-targets: wasm32-unknown-unknown
      rustflags: '--cfg=web_sys_unstable_apis --cfg=getrandom_backend="wasm_js" -D warnings'
      command: |
        cargo build --locked --target=wasm32-unknown-unknown
        cargo build --locked --manifest-path step-redox/web/step-redox-wasm/Cargo.toml --target=wasm32-unknown-unknown
  release-libs:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      validation-tier: release
      checkout-submodules: "true"
      rustflags: "-D warnings -C target-cpu=x86-64-v2"
      command: cargo test --locked --workspace --lib
  readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
        id: compiler
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-rdme@2.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just readme-check
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
  workflow-policy:
    uses: codeandsolder/ci-workflows/.github/workflows/workflow-concurrency.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
  merge-gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [native, wasm, release-libs, readme, source-quality, workflow-policy]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["native","success"],["wasm","success"],["release-libs","${{ startsWith(github.ref, 'refs/tags/') && 'success' || 'skipped' }}"],["readme","success"],["source-quality","success"],["workflow-policy","success"]]
