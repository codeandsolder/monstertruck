name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      # `rustfmt.toml` opts into unstable options (`fn_single_line`,
      # `where_single_line`, `brace_style = "PreferSameLine"`); stable
      # rustfmt silently ignores those, so the fmt check has to run on
      # nightly to actually apply them.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: cargo clippy
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main
        with:
          rust-toolchain: "1.99.1"
          rustflags: "-D warnings"
      - run: cargo clippy --all-targets -- -D warnings
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main


  test:
    name: cargo test (cpu)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main
        with:
          rust-toolchain: "1.99.1"
          rustflags: "-D warnings"
      - uses: taiki-e/install-action@nextest
      # Pinned: cargo-rdme's output is not stable across major versions, so an
      # unpinned `@latest` would fail `readme-check` the day it majors.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-rdme@2.1.0
      - uses: extractions/setup-just@v4
      - run: just readme-check
      - run: just test-cpu
      - run: just test-doc
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main


  shared-sccache:
    name: workspace lib tests (shared sccache)
    permissions:
      contents: read
      id-token: write
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@9be344b41c4c7e53f451d7ab1f66d7d9e7a9a6f4 # main
    with:
      command: |
        git submodule update --init resources
        cargo +1.99.1 test --workspace --lib
      rust-toolchain: "1.99.1"
      rustflags: "-D warnings -C target-cpu=x86-64-v2"

  meshing-features:
    name: monstertruck-meshing feature subsets
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main
        with:
          rust-toolchain: "1.99.1"
          rustflags: "-D warnings"
      - uses: extractions/setup-just@v4
      - run: just meshing-features
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main


  wasm-build:
    name: cargo build (wasm32)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main
        with:
          rust-toolchain: "1.99.1"
          rustflags: "-D warnings"
      - uses: extractions/setup-just@v4
      - run: just wasm-build
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@18397eb8f0bd8a76f90010a66a8519011f7992ca # main

