name: CAD recovery corpus (release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jlc-cad-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve repository compiler
        run: rustup show active-toolchain
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          cache-scope: step-recovery-release
          rustflags: "-D warnings"
      - name: STEP recovery unit tests
        run: cargo --config 'build.rustflags=["-D","warnings"]' test --release -p step-redox --lib --bin step-validate-semantics --features cad-kernel-monstertruck --target-dir "$RUNNER_TEMP/step-recovery"
      - name: Prepare STEP recovery executables
        run: cargo --config 'build.rustflags=["-D","warnings"]' build --release -p step-redox --features cad-kernel-monstertruck --bin step-redox --bin step-count-resize --bin step-chain-resize --bin step-validate-semantics --target-dir "$RUNNER_TEMP/step-recovery"
      - name: Check independent OCCT kernel and validation invariants
        run: cargo --config 'build.rustflags=["-D","warnings"]' test --release --locked --manifest-path step-redox/tools/occt-wasm-validator/Cargo.toml --target-dir "$RUNNER_TEMP/occt-validator"
      - name: Prepare independent OCCT validator
        run: cargo --config 'build.rustflags=["-D","warnings"]' build --release --locked --manifest-path step-redox/tools/occt-wasm-validator/Cargo.toml --target-dir "$RUNNER_TEMP/occt-validator"
      - name: Check real-model geometry and renderings
        run: |
          "$RUNNER_TEMP/occt-validator/release/step-redox-occt-wasm-validator" run \
            --manifest step-redox/validation/fixtures.json \
            --cache "$RUNNER_TEMP/step-fixtures" \
            --out "$RUNNER_TEMP/step-validation" \
            --step-redox "$RUNNER_TEMP/step-recovery/release/step-redox" \
            --step-count-resize "$RUNNER_TEMP/step-recovery/release/step-count-resize" \
            --step-chain-resize "$RUNNER_TEMP/step-recovery/release/step-chain-resize"
      - name: Check independently specified recovery semantics
        run: |
          "$RUNNER_TEMP/step-recovery/release/step-validate-semantics" \
            --manifest step-redox/validation/fixtures.json \
            --cache "$RUNNER_TEMP/step-fixtures" \
            --out "$RUNNER_TEMP/step-validation/semantic-probes" \
            --step-redox "$RUNNER_TEMP/step-recovery/release/step-redox"
      - name: Preserve CAD validation reports and renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: step-validation
          path: ${{ runner.temp }}/step-validation
          retention-days: 7
          if-no-files-found: warn
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
