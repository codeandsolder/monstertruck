name: OCCT WASM validation bindings

on:
  pull_request:
    paths:
      - step-redox/tools/occt-wasm-validator/**
      - .github/workflows/occt-wasm-validation-bindings.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occt-wasm-validation-bindings-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve the repository compiler
        run: rustup show active-toolchain
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@e3c936399ed6a5a497aa4b07bbc3427bf12c7dc4 # main
        with:
          repository-path: step-redox/tools/occt-wasm-validator
          cache-scope: occt-wasm-validation-bindings
      - name: Exercise the fork's embedded kernel directly
        run: cargo test --locked --release --manifest-path step-redox/tools/occt-wasm-validator/Cargo.toml
      - name: Lint the standalone validator
        run: cargo clippy --locked --release --all-targets --manifest-path step-redox/tools/occt-wasm-validator/Cargo.toml -- -D warnings
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@e3c936399ed6a5a497aa4b07bbc3427bf12c7dc4 # main
