[package]
name = "step-redox-viewer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ruststep = { package = "step-p21", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
monstertruck-io = { workspace = true, features = ["step"] }
monstertruck-meshing = { workspace = true }
monstertruck-mesh = { workspace = true }
monstertruck-topology = { workspace = true }
