[package]
name = "step-redox-occt-wasm-validator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
occt-wasm = { git = "https://github.com/codeandsolder/occt-wasm-truck.git", rev = "cfea225919cec3465edac39a4ed81e4ffb49485a" }
sha2 = "0.11"

# Dedicated nightly / external-OCCT toolchain outside production workspace.
[workspace]
