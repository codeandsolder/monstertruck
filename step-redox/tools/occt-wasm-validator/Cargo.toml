[package]
name = "step-redox-occt-wasm-validator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
num-traits = "0.2"
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
occt-wasm = { git = "https://github.com/codeandsolder/occt-wasm-truck.git", rev = "b160cc637a155eeaed67a36fb1433f921702399a" }
sha2 = "0.11"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dedicated nightly / external-OCCT toolchain outside production workspace.
[workspace]
