[package]
name = "step-redox-occt-wasm-validator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
num-traits = "0.2"
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
occt-wasm = { git = "https://github.com/codeandsolder/occt-wasm-truck.git", rev = "482f09abd3578f936df15910dee04ddcad6b111f" }
sha2 = "0.11"
tempfile = "3"
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "7c0668c3b3e137f233c0aaee132028ab39572dbd", features = ["stream", "system-proxy"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
futures-util = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dedicated nightly / external-OCCT toolchain outside production workspace.
[workspace]
