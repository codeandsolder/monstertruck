[package]
name = "step-redox"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99"

[features]
default = []
cad-kernel-monstertruck = ["dep:monstertruck-geometry", "dep:monstertruck-modeling", "dep:monstertruck-solid", "dep:monstertruck-fillet", "dep:monstertruck-topology"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ruststep = { package = "step-p21", version = "0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
monstertruck-geometry = { workspace = true, optional = true }
monstertruck-modeling = { workspace = true, features = ["fillet"], optional = true }
monstertruck-io = { workspace = true, features = ["step"] }
monstertruck-solid = { workspace = true, optional = true }
monstertruck-fillet = { workspace = true, optional = true }
monstertruck-topology = { workspace = true, optional = true }
num-traits = "0.2.19"
monstertruck-core = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
unfulfilled_lint_expectations = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
correctness = "warn"
suspicious = "warn"
perf = "warn"
style = "warn"
complexity = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
await_holding_lock = "warn"
allow_attributes_without_reason = "warn"
